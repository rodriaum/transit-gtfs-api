plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
}

group = 'com.tranzor'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.osgeo.org/repository/release/' }
    // Add Sonatype releases and JitPack as additional repository sources for certain artifacts
    maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Import Spring Boot dependency management BOM so we can omit explicit versions for many deps
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.2.1')

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    
    // Database
    implementation 'org.postgresql:postgresql'
    implementation 'org.hibernate:hibernate-spatial:6.4.1.Final'
    implementation 'org.locationtech.jts:jts-core:1.19.0'
    
    // Cassandra (para grandes volumes)
    implementation 'org.springframework.boot:spring-boot-starter-data-cassandra'
    
    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'redis.clients:jedis:5.1.0'
    
    // Flyway para migrações
    implementation 'org.flywaydb:flyway-core'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    
    // Swagger/OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    
    // MapStruct para mapeamento
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    
    // GTFS parsing
    implementation 'org.onebusaway:onebusaway-gtfs:1.3.4'
    
    // HTTP Client para download de GTFS
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3'
    
    // WebSocket para realtime
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    
    // GTFS-Realtime
    implementation 'com.google.protobuf:protobuf-java:3.25.1'
    
    // Resilience4j para circuit breaker
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.1.0'
    
    // Lombok - set explicit version to ensure resolution if BOM is missing
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.testcontainers:postgresql:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    testImplementation 'com.redis.testcontainers:testcontainers-redis-junit:1.6.4'
    
    // Outros
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

// Ensure the compiler uses the release flag so compilation targets Java 21 even if the JVM differs
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.release.set(21)
    // Use the toolchain's javac so annotation processors run with the matching compiler implementation
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(21))
    })
}

tasks.named('test') {
    useJUnitPlatform()
}
